name: Build Cineseat Alpha28 APK
on:
  push:
    branches: [cineseat-alpha28-build]
    paths:
      - '.github/workflows/cineseat-build-alpha28.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION_NAME: 0.2.1-alpha.28
      APP_VERSION_CODE: '48'
    steps:
      - uses: actions/checkout@v4
      - name: Restore private Cineseat build payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cinema_alpha_payload
          mkdir -p cinema_alpha_payload/lib cinema_alpha_payload/android cinema_alpha_payload/ci
          get(){ echo "fetch $(basename "$2")"; curl --retry 2 --retry-delay 1 -fsSL "$1" -o "$2"; }
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/ads.dart?token=ABDH46X7OI5KXLMM5PO72CTKQLFPXAA' cinema_alpha_payload/lib/ads.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/app_controller.dart?token=ABDH46SSVXMDUASRP2ALTGDKQLFPXAA' cinema_alpha_payload/lib/app_controller.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/background_monitor.dart?token=ABDH46RLW6HWPPCOCRPMOCLKQLFPXAA' cinema_alpha_payload/lib/background_monitor.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/cgv_seat_bridge.dart?token=ABDH46W5PJYSDHC4LUH2LBTKQLFPXAA' cinema_alpha_payload/lib/cgv_seat_bridge.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/home.dart?token=ABDH46WVJXJB7KOYEG7CR4LKQLFPXAA' cinema_alpha_payload/lib/home.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/home_v2.dart?token=ABDH46RKETPMMBVETJYUADDKQLFPXAA' cinema_alpha_payload/lib/home_v2.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/home_v3.dart?token=ABDH46XOXJ5ZLNVZPEAJ2I3KQLFPXAA' cinema_alpha_payload/lib/home_v3.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/main.dart?token=ABDH46VCVFIHR34JEBQ7UCDKQLFPXAA' cinema_alpha_payload/lib/main.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/models.dart?token=ABDH46U2IOPWCFV7A6DFF3DKQLFPXAA' cinema_alpha_payload/lib/models.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/official_seat_web.dart?token=ABDH46UTV6PYWCFVQJYSI5DKQLFPXAA' cinema_alpha_payload/lib/official_seat_web.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/runtime_status_card.dart?token=ABDH46R5EGSQII6JF34ESR3KQLFPXAA' cinema_alpha_payload/lib/runtime_status_card.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/services.dart?token=ABDH46X4ISKPRBTYOJRHHNTKQLFPXAA' cinema_alpha_payload/lib/services.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/settings_v2.dart?token=ABDH46XIG5PABM7WRUATRQ3KQLFPXAA' cinema_alpha_payload/lib/settings_v2.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/shared_widgets.dart?token=ABDH46RQVWVHMJFIML5HPZDKQLFPXAA' cinema_alpha_payload/lib/shared_widgets.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/wizard.dart?token=ABDH46RUKXBULWKHJHPXBJTKQLFPXAA' cinema_alpha_payload/lib/wizard.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/wizard_v2.dart?token=ABDH46ULTBA7KU3CP7FT6LLKQLFPXAA' cinema_alpha_payload/lib/wizard_v2.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/wizard_v4.dart?token=ABDH46S4IQLU5MEQ6E4GRULKQLFPXAA' cinema_alpha_payload/lib/wizard_v4.dart
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/android/BootReceiver.kt?token=ABDH46R6W5SUSWAXZQTQNW3KQLFSZAA' cinema_alpha_payload/android/BootReceiver.kt
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/android/MainActivity.kt?token=ABDH46WFK4LBLTFHM5MYRQLKQLFSZAA' cinema_alpha_payload/android/MainActivity.kt
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/android/SeatMonitorService.kt?token=ABDH46X74WB2JFXLIA67DRTKQLFSZAA' cinema_alpha_payload/android/SeatMonitorService.kt
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/app_icon.png.b64?token=ABDH46UMW4JHQXYVEU2PL53KQLFSJAA' cinema_alpha_payload/app_icon.png.b64
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/build_patch_v2.py?token=ABDH46WZVRILDNRUBAL4N4TKQLFSJAA' cinema_alpha_payload/build_patch_v2.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/fix_kotlin_interpolation.py?token=ABDH46S5I7U4X3EMY3R2VX3KQLFSJAA' cinema_alpha_payload/fix_kotlin_interpolation.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/sitecustomize.py?token=ABDH46TVFMZTM5WLHGC4JQTKQLFSJAA' cinema_alpha_payload/sitecustomize.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha8_restore.py?token=ABDH46VWU2QJNPNA5OEEMT3KQLFSJAA' cinema_alpha_payload/apply_alpha8_restore.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha9_contrast.py?token=ABDH46TPMW6OPULKD6QFHIDKQLFSJAA' cinema_alpha_payload/apply_alpha9_contrast.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha10_watch_edit_semantics.py?token=ABDH46T2Y7TECDUHQATHNULKQLFSJAA' cinema_alpha_payload/apply_alpha10_watch_edit_semantics.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha11_schedule_match.py?token=ABDH46SX6MHU3L77O3JKEHTKQLFSJAA' cinema_alpha_payload/apply_alpha11_schedule_match.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha12_login_gated_seats.py?token=ABDH46RD3DOWZPXZQAUWOYTKQLFSJAA' cinema_alpha_payload/apply_alpha12_login_gated_seats.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha14_official_seat_web.py?token=ABDH46QKCG3INDP6B2NSGULKQLFSJAA' cinema_alpha_payload/apply_alpha14_official_seat_web.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha15_cgv_exact_api.py?token=ABDH46S2T5FFLSOWPBK435TKQLFSJAA' cinema_alpha_payload/apply_alpha15_cgv_exact_api.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha16_all_exact_no_login.py?token=ABDH46WB5Z6KZQA6RDPOX7LKQLFSJAA' cinema_alpha_payload/apply_alpha16_all_exact_no_login.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha17_expiry_layout_diagnostics.py?token=ABDH46TL2Y3EUZZ2YC2X5C3KQLFSJAA' cinema_alpha_payload/apply_alpha17_expiry_layout_diagnostics.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha18_navigation_edit_region.py?token=ABDH46WAJG5X2WU6IQC3DU3KQLFSJAA' cinema_alpha_payload/apply_alpha18_navigation_edit_region.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha19_runtime_regression.py?token=ABDH46V4X6TKCXD3BD6WSC3KQLFSJAA' cinema_alpha_payload/apply_alpha19_runtime_regression.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha19_material_runtime_fix.py?token=ABDH46TUPLG6YKD5R5L5O43KQLFSJAA' cinema_alpha_payload/apply_alpha19_material_runtime_fix.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha21_region_watch_rollback.py?token=ABDH46UC4KKE3UMC4YHPQ3DKQLFSJAA' cinema_alpha_payload/apply_alpha21_region_watch_rollback.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha26_region_cgv_flow.py?token=ABDH46RDEZXB6AUJVTLZK6DKQLFSJAA' cinema_alpha_payload/apply_alpha26_region_cgv_flow.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha26_compile_fix.py?token=ABDH46RMGMW4KGUVIYY5IYLKQLFSJAA' cinema_alpha_payload/apply_alpha26_compile_fix.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha27_expiry_cgv_guest.py?token=ABDH46VYKRY6Z3V3SC7H2HDKQLFSJAA' cinema_alpha_payload/apply_alpha27_expiry_cgv_guest.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha27_compile_fix.py?token=ABDH46QBLRIXZYDS2W7Z4MLKQLFSJAA' cinema_alpha_payload/apply_alpha27_compile_fix.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/apply_alpha28_cgv_silent_webview.py?token=ABDH46U6FXIRUOHVBY5B2G3KQLFSJAA' cinema_alpha_payload/apply_alpha28_cgv_silent_webview.py
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/ci/build_alpha26.sh?token=ABDH46XLBNX7BLBDN6ERK7TKQLFTDAA' cinema_alpha_payload/ci/build_alpha26.sh
          get 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/ci/build_alpha27.sh?token=ABDH46U2NEGDNGBGHMAIARLKQLFTDAA' cinema_alpha_payload/ci/build_alpha27.sh
          chmod +x cinema_alpha_payload/ci/*.sh
          test -s cinema_alpha_payload/lib/wizard_v4.dart
          test -s cinema_alpha_payload/apply_alpha28_cgv_silent_webview.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Prepare project
        run: bash cinema_alpha_payload/ci/build_alpha27.sh prepare
      - name: Build and verify APK
        run: bash cinema_alpha_payload/ci/build_alpha27.sh build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-alpha28-silent-cgv
          path: dist/*
          if-no-files-found: error
          retention-days: 7
