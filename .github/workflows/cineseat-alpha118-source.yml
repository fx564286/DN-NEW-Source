name: Build Cineseat Alpha118 APK
on:
  push:
    branches: [cineseat-alpha28-build]
    paths:
      - '.github/workflows/cineseat-alpha118-source.yml'
      - 'alpha118_src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.fx564286 --project-name cinema_seat_alert build_app
          rm -rf build_app/lib
          mkdir -p build_app/lib
          cp alpha118_src/lib/*.dart build_app/lib/
          cat > build_app/pubspec.yaml <<'YAML'
          name: cinema_seat_alert
          description: Cineseat alpha118
          publish_to: none
          version: 0.2.1-alpha.118+118
          environment:
            sdk: '>=3.6.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            crypto: ^3.0.6
            geolocator: ^14.0.2
            http: ^1.5.0
            shared_preferences: ^2.5.3
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^6.0.0
          flutter:
            uses-material-design: true
          YAML
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build_app/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms='''\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'''
          s=s.replace(marker, marker+perms, 1)
          p.write_text(s)
          PY
      - name: Resolve and analyze
        working-directory: build_app
        run: |
          flutter pub get
          dart format lib
          flutter analyze
      - name: Build alpha118 APK
        working-directory: build_app
        run: flutter build apk --release --build-name 0.2.1-alpha.118 --build-number 118
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build_app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/tmp/unzip.txt
          tail -n 2 /tmp/unzip.txt
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/Cineseat_0.2.1-alpha118.apk
          sha256sum dist/Cineseat_0.2.1-alpha118.apk | tee dist/Cineseat_0.2.1-alpha118.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cineseat_0.2.1-alpha118
          path: dist/*
          if-no-files-found: error
          retention-days: 7
