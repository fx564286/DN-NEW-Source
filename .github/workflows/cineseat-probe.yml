    steps:
      - run: |
          set -euxo pipefail
          curl -fL 'https://raw.githubusercontent.com/fx564286/-/main/cinema_alpha_payload/lib/models.dart?token=ABDH46QMELMGJCO6CEWDZH3KQLGE5AA' -o /tmp/models.dart
